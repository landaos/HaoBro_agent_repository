[project]
name = "agent-backend"
version = "0.1.0"
description = "中小企业级 RAG 知识库问答助手后端服务"
requires-python = ">=3.11"
dependencies = [
    # --- Web 框架 ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",

    # --- LLM 与 Agent ---
    "langchain>=1.3.14",
    "langchain-community>=0.4.0",
    "langchain-core>=1.4.0",
    "langgraph>=1.2.9",
    "langsmith>=0.3.0",

    # --- 数据库 ---
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "psycopg2-binary",
    "pgvector>=0.3",

    # --- RAG ---
    "sentence-transformers>=3.3",
    "pypdf>=5.1",
    "unstructured>=0.16",
    "docling>=2.114.0",

    # --- 缓存与限流 ---
    "redis>=5.2",

    # --- 工具 ---
    "python-dotenv>=1.0",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "tenacity>=9.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "arq>=0.26",
    "apscheduler>=3.10",
    "python-magic>=0.4",
    "aiofiles>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.28",
    "fakeredis[lua]>=2.26",
    "pre-commit>=3.8",
]

[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
