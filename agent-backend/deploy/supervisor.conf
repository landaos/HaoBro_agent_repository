# ============================================
# supervisor.conf - Supervisor 进程管理配置
# ============================================
#
# ═══════════════════════════════════════════
# 需要在此文件中编写的配置：
# ═══════════════════════════════════════════
#
# [program:agent-backend]
# command=/opt/agent-backend/.venv/bin/uvicorn src.main:app --host 127.0.0.1 --port 8000 --workers 4
# directory=/opt/agent-backend
# user=www-data
# autostart=true
# autorestart=true
# startretries=3
# stopasgroup=true
# killasgroup=true
# stdout_logfile=/var/log/agent-backend/supervisor.out.log
# stderr_logfile=/var/log/agent-backend/supervisor.err.log
# stdout_logfile_maxbytes=50MB
# stdout_logfile_backups=10
# environment=
#   PYTHONPATH="/opt/agent-backend",
#   APP_ENV="production",
#   DB_HOST="localhost",
#   DB_PORT="5432",
#   ...
#   # 注意：敏感信息通过环境变量传入，不要把 .env 暴露给 supervisor
#
# [group:agent]
# programs=agent-backend,agent-worker
#
# [program:agent-worker]
# command=/opt/agent-backend/.venv/bin/python -m src.worker
# ...
#
# ═══════════════════════════════════════════
# 常用命令：
#   supervisorctl reread           # 重新加载配置
#   supervisorctl update           # 应用更新
#   supervisorctl start agent:*    # 启动所有 agent 相关进程
#   supervisorctl status           # 查看状态
# ═══════════════════════════════════════════
